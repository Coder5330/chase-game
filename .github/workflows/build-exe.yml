name: Build executables

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -t . -v

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            data_sep: ";"
            asset_name: chase-game-windows.exe
            butler_platform: windows-amd64
            itch_channel: windows
          - os: macos-latest
            data_sep: ":"
            asset_name: chase-game-mac.zip
            butler_platform: darwin-arm64
            itch_channel: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name chase-game --add-data "assets${{ matrix.data_sep }}assets" main.py

      - name: Package artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cp dist/chase-game.exe "dist/${{ matrix.asset_name }}"

      - name: Package artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r "${{ matrix.asset_name }}" chase-game.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Push to itch.io
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -L -o butler.zip "https://broth.itch.zone/butler/${{ matrix.butler_platform }}/LATEST/archive/default"
          unzip -o butler.zip -d butler_bin
          BUTLER_BIN=$(find butler_bin -maxdepth 1 -iname "butler*" -type f | head -1)
          chmod +x "$BUTLER_BIN"
          "$BUTLER_BIN" push "dist/${{ matrix.asset_name }}" coder5330/chase-game:${{ matrix.itch_channel }} --userversion "$(git rev-parse --short HEAD)"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write release notes
        shell: bash
        run: |
          {
            echo "# Chase Game"
            echo
            echo "A top-down survivors-like: dodge and outlast waves of enemies, auto-fire weapons, level up mid-run, and spend earned resources on permanent upgrades. Built automatically from the latest commit -- see the [Actions tab](../../actions) for the build that produced this exact release."
            echo
            echo "## Download"
            echo "- **Windows**: \`chase-game-windows.exe\` -- Windows will show a \"Windows protected your PC\" SmartScreen warning. That's because this is free software without a paid code-signing certificate, not because it's unsafe -- click **More info -> Run anyway**."
            echo "- **Mac**: \`chase-game-mac.zip\` -- unzip it, then right-click (or Control-click) \`chase-game.app\` and choose **Open** instead of double-clicking. Same reason as above (unsigned, not malicious). You only need to do this once."
            echo
            echo "No installer, no Python, no internet connection needed to play."
          } > release_notes.md

      - name: Publish "latest" release
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            artifacts/chase-game-windows.exe/chase-game-windows.exe \
            artifacts/chase-game-mac.zip/chase-game-mac.zip \
            --title "Chase Game - latest build" \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
